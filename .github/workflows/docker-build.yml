name: Build and Push Docker Image

on:
  workflow_dispatch: # Allows manual triggering

jobs:
  build-and-push:
    # Use ubuntu-latest for amd64 and a specific ARM runner for arm64
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    strategy:
      matrix:
        arch: [amd64, arm64]
      fail-fast: false # Ensure all matrix jobs complete even if one fails initially
    permissions:
      contents: read
      packages: write # Needed to push to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # QEMU setup is removed as we build natively

      - name: Set up Docker Buildx
        # Use default buildx instance which supports multi-platform
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }} # metadata-action handles lowercasing for image name
          tags: |
            type=raw,value=latest-${{ matrix.arch }} # Arch-specific tag

      - name: Build and push Docker image for ${{ matrix.arch }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }} # Build only for the current matrix architecture
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Enable caching to potentially speed up builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push-manifest:
    runs-on: ubuntu-latest
    needs: build-and-push # Run after both arch builds complete successfully
    permissions:
      contents: read
      packages: write # Needed to push manifest to GHCR
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        env:
          # Get the repository name and convert to lowercase for manifest commands
          REPO_LOWER: ${{ github.repository }}
        run: |
          REPO_LOWER=$(echo "$REPO_LOWER" | tr '[:upper:]' '[:lower:]')
          echo "Creating manifest for ghcr.io/${REPO_LOWER}:latest"
          docker manifest create ghcr.io/${REPO_LOWER}:latest \
            --amend ghcr.io/${REPO_LOWER}:latest-amd64 \
            --amend ghcr.io/${REPO_LOWER}:latest-arm64
          echo "Pushing manifest ghcr.io/${REPO_LOWER}:latest"
          docker manifest push ghcr.io/${REPO_LOWER}:latest
